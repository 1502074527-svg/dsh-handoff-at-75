- insert:
    - id: handoff-at-75
      name: '@local/dsh-handoff-at-75'
      config:
        # 交接触发点：已用 token 达到 budgetTokens × thresholdRatio 时。
        # 默认 150000 × 0.75 = 112500，贴合「上下文超过 150k 前就该换会话」的实测纪律。
        budgetTokens: 150000
        thresholdRatio: 0.75
        # auto    = 全自动（默认）：生成交接文档 + 通知文件 → 同项目新建会话 → 发首条提示词直接开跑
        # confirm = 先在当前对话弹卡询问（含「本代不再提醒」），批准后才执行
        # off     = 停用
        mode: auto
        # 确认模式下等待用户回答的时长（毫秒）
        confirmTimeoutMs: 120000
        # 交接文档文件名，写入当前项目目录（与工作区 cwd 相同）
        stateFileName: PROJECT_STATE.md
        # 命中阈值后，会话上下文因压缩明显回落（低于该比例）时可再次触发
        rearmRatio: 0.4
        # 侧栏会话行四色状态染色开关（进行中黄/待回答橙/完成未读绿/失败·额度用尽红，保留毛玻璃）
        # 面板里可即时开关；false = 彻底恢复宿主原生外观；与 mode 正交
        rowTint: true
