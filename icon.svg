    <path d="M13.6 12.4h7.4a2.2 2.2 0 0 1 2.2 2.2v3a2.2 2.2 0 0 1-2.2 2.2h-2.4v2l-2.7-2h-2.3a2.2 2.2 0 0 1-2.2-2.2v-3a2.2 2.2 0 0 1 2.2-2.2Z"/>
